<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עופר מרסיאנו</title>
<meta name="description" content="עופר מרסיאנו - בקרוב">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'Mixtape';
    src: url('assets/fonts/mixtape-regular-fm.otf') format('opentype');
    font-display: swap;
  }
  @font-face {
    font-family: 'OHYael';
    src: url('assets/fonts/OHYaelLeibushor2.0-Regular.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Assistant';
    src: url('assets/fonts/Assistant-VariableFont.ttf') format('truetype');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --cream: #E1D5C7;
    --umber: #7A5541;
    --charcoal: #2B2219;
    --wheat: #E4C285;
    --ink: #1A1A1A;
    --logo-color: var(--umber);
    --headline-color: var(--umber);
    --bg: var(--cream);
    --caption-color: var(--umber);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--charcoal);
      --headline-color: var(--wheat);
      --logo-color: var(--cream);
      --caption-color: var(--wheat);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--charcoal);
    --headline-color: var(--wheat);
    --logo-color: var(--cream);
    --caption-color: var(--wheat);
  }
  :root[data-theme="light"] {
    --bg: var(--cream);
    --headline-color: var(--umber);
    --logo-color: var(--umber);
    --caption-color: var(--umber);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 56px);
    padding: 8vh 6vw;
    background: var(--bg);
    font-family: 'Assistant', sans-serif;
  }

  .logo {
    height: clamp(36px, 6vw, 56px);
    width: auto;
    color: var(--logo-color);
  }

  .quote {
    font-family: 'OHYael', cursive;
    color: var(--headline-color);
    font-size: clamp(1.4rem, 3.6vw, 2.2rem);
    line-height: 1.5;
    text-align: center;
    max-width: 20ch;
    text-wrap: balance;
  }

  .quote span {
    display: block;
  }

  .quote span:nth-child(1) {
    font-size: 1.1em;
  }

  .quote span:nth-child(2) {
    font-size: 0.9em;
    opacity: 0.75;
  }

  .quote span:nth-child(3) {
    font-size: 1.9em;
    margin-top: 0.15em;
  }

  .divider {
    width: 64px;
    height: 2px;
    background: var(--wheat);
    border: none;
    margin: 0;
  }

  .soon {
    font-family: 'Mixtape', sans-serif;
    color: var(--headline-color);
    font-size: clamp(3rem, 11vw, 6rem);
    line-height: 1;
    letter-spacing: 0.01em;
  }

  .socials {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(14px, 3vw, 22px);
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .socials a {
    display: block;
    line-height: 0;
    color: var(--logo-color);
    opacity: 0.85;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .socials a:hover,
  .socials a:focus-visible {
    opacity: 1;
    transform: translateY(-2px);
  }

  .socials a:focus-visible {
    outline: 2px solid var(--wheat);
    outline-offset: 4px;
    border-radius: 4px;
  }

  .socials svg {
    height: clamp(22px, 3.6vw, 28px);
    width: clamp(22px, 3.6vw, 28px);
    display: block;
    fill: currentColor;
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo,
    .divider,
    .soon,
    .socials {
      animation: rise 0.9s ease both;
    }
    .quote span {
      animation: rise 0.7s ease both;
    }
    .logo { animation-delay: 0s; }
    .quote span:nth-child(1) { animation-delay: 0.15s; }
    .quote span:nth-child(2) { animation-delay: 0.3s; }
    .quote span:nth-child(3) { animation: riseBig 0.8s ease both; animation-delay: 0.45s; }
    .divider { animation-delay: 0.65s; }
    .soon { animation-delay: 0.75s; }
    .socials { animation-delay: 0.9s; }
    .socials a { transition: opacity 0.15s ease, transform 0.15s ease; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes riseBig {
    from { opacity: 0; transform: translateY(14px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
